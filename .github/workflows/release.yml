# Builds the Windows installers and the Mac app and publishes a GitHub release.
# Runs when a version tag (v0.2.0, ...) is pushed; can also be started by hand for an existing tag.
# Started by hand with publish unchecked, it only builds the selected branch, for trying changes
# to the packaging (the tag then only names the version the files should have).
# Release notes come from .github/release-notes/<tag>.md when that file exists.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, for example v0.2.0
        required: true
      publish:
        description: Publish the release (unchecked = only build the selected branch)
        type: boolean
        default: true

# Build jobs only read the repository; the publish job alone can write releases
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # What to build: the tag, or the selected branch for a build-only run
  SOURCE: ${{ (github.event_name == 'workflow_dispatch' && !inputs.publish) && github.sha || github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Build Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Self-test
        run: dotnet run --project windows/EarPair.Sender.SelfTest -c Release

      - name: Package
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File windows\build.ps1

      - name: Check file names against the tag
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $expected = foreach ($rid in 'win-x64', 'win-arm64') { "EarPair-$version-$rid-setup.exe" }
          $missing = $expected | Where-Object { -not (Test-Path (Join-Path dist $_)) }
          if ($missing) { throw "Missing in dist: $($missing -join ', '). Does the tag match the app version in the .csproj files?" }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*
          if-no-files-found: error

  macos:
    name: Build Mac app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"

      - name: Tests
        run: swift test --package-path macos

      - name: Package
        run: |
          version="${TAG#v}"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Resources/Info.plist)"
          if [ "$app_version" != "$version" ]; then
            echo "macos/Resources/Info.plist says $app_version, the tag says $version"
            exit 1
          fi
          macos/scripts/build-app.sh
          app=macos/build/EarPair.app
          archs="$(lipo -archs "$app/Contents/MacOS/EarPair")"
          echo "Architectures: $archs"
          # Intel Macs update themselves from this dmg too, so it has to be universal
          case "$(echo $archs | tr ' ' '\n' | sort | tr '\n' ' ')" in
            "arm64 x86_64 ") platform=macos-universal ;;
            *) echo "Expected a universal app (arm64 and x86_64), got: $archs"; exit 1 ;;
          esac
          ls "$app/Contents/Resources/EarPair_EarPairUI.bundle/Contents/Resources/zh-Hans.lproj/Localizable.strings"
          codesign --verify --deep --strict "$app"
          # A dmg: open it and drag EarPair onto the Applications link next to it
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage" dist
          ditto "$app" "$stage/EarPair.app"
          ln -s /Applications "$stage/Applications"
          dmg="dist/EarPair-$version-$platform.dmg"
          # hdiutil sometimes reports "Resource busy" on GitHub Mac runners: retry
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname EarPair -srcfolder "$stage" -fs HFS+ -format UDZO -ov "$dmg" && break
            [ "$attempt" = 5 ] && exit 1
            sleep 10
          done
          hdiutil verify "$dmg"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: mac-package
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, macos]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-package*'
          merge-multiple: true
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            if [ -f "$notes" ]; then gh release edit "$TAG" --notes-file "$notes"; fi
          elif [ -f "$notes" ]; then
            gh release create "$TAG" dist/* --verify-tag --title "EarPair ${TAG#v}" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --verify-tag --title "EarPair ${TAG#v}" --generate-notes
          fi
