# Builds the Windows packages and publishes a GitHub release.
# Runs when a version tag (v0.2.0, ...) is pushed; can also be started by hand for an existing tag.
# Release notes come from .github/release-notes/<tag>.md when that file exists.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, for example v0.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Build Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Self-test
        run: dotnet run --project windows/EarPair.Sender.SelfTest -c Release

      - name: Package
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File windows\build.ps1

      - name: Check file names against the tag
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $expected = foreach ($rid in 'win-x64', 'win-arm64') { "EarPair-$version-$rid.zip"; "EarPair.Sender-$version-$rid.exe" }
          $missing = $expected | Where-Object { -not (Test-Path (Join-Path dist $_)) }
          if ($missing) { throw "Missing in dist: $($missing -join ', '). Does the tag match the app version in the .csproj files?" }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            if [ -f "$notes" ]; then gh release edit "$TAG" --notes-file "$notes"; fi
          elif [ -f "$notes" ]; then
            gh release create "$TAG" dist/* --verify-tag --title "EarPair ${TAG#v}" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --verify-tag --title "EarPair ${TAG#v}" --generate-notes
          fi
